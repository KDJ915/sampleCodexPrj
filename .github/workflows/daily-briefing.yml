name: Daily procurement AI briefing

on:
  schedule:
    # 09:00 Asia/Seoul (UTC+9). GitHub Actions schedules use UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-procurement-ai-briefing
  cancel-in-progress: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRIEFING_RECIPIENT: ${{ secrets.BRIEFING_RECIPIENT }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      BRIEFING_SENDER: ${{ secrets.BRIEFING_SENDER }}
      SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'ssl' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          for name in OPENAI_API_KEY BRIEFING_RECIPIENT SMTP_HOST SMTP_USERNAME SMTP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required Actions secrets: %s\n' "${missing[*]}"
            {
              echo '## 브리핑 설정 필요'
              echo
              echo "다음 Repository secrets를 등록해야 합니다: \`${missing[*]}\`"
              echo
              echo "1. [Actions secrets 설정](https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions)을 엽니다."
              echo '2. **New repository secret**을 눌러 누락된 값을 각각 등록합니다.'
              echo '3. 이 워크플로를 다시 실행합니다.'
              echo
              echo '> 비밀번호나 API 키를 워크플로 파일 또는 실행 입력값에 직접 적지 마세요.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --requirement requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate and send briefing
        run: python briefing.py
