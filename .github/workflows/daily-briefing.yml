name: Daily procurement AI briefing

on:
  schedule:
    # 09:00 Asia/Seoul (UTC+9). GitHub Actions schedules use UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-procurement-ai-briefing
  cancel-in-progress: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRIEFING_RECIPIENT: ${{ secrets.BRIEFING_RECIPIENT }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      BRIEFING_SENDER: ${{ secrets.BRIEFING_SENDER }}
      SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'ssl' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --requirement requirements.txt
      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          for name in OPENAI_API_KEY BRIEFING_RECIPIENT SMTP_HOST SMTP_USERNAME SMTP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate and send briefing
        run: python briefing.py
